name: publish website
run-name: publish new version on server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/image
          tags: hyultisfr:latest
          outputs: type=docker,dest=/tmp/hyultisfr.tar
          cache-from: type=gha,scope=hyultisfr
          cache-to: type=gha,mode=max,scope=hyultisfr,ignore-error=true

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "${{ secrets.REMOTE_SERVER_PUBKEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer Docker Compose file
        run: |
          scp \
            -o StrictHostKeyChecking=yes \
            -P "${{ secrets.REMOTE_SERVER_PORT }}" \
            ./docker/docker-compose.yml \
            "${{ secrets.REMOTE_SERVER_USERNAME }}@${{ secrets.REMOTE_SERVER_ADDRESS }}:${{ secrets.REMOTE_SERVER_PATH }}/docker-compose.yml"

      - name: Load Docker image on remote server
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -T \
            -p "${{ secrets.REMOTE_SERVER_PORT }}" \
            "${{ secrets.REMOTE_SERVER_USERNAME }}@${{ secrets.REMOTE_SERVER_ADDRESS }}" \
            'sudo docker load' \
            < /tmp/hyultisfr.tar

      - name: Deploy Docker container
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -T \
            -p "${{ secrets.REMOTE_SERVER_PORT }}" \
            "${{ secrets.REMOTE_SERVER_USERNAME }}@${{ secrets.REMOTE_SERVER_ADDRESS }}" << 'ENDSSH'
          set -eu

          cd "${{ secrets.REMOTE_SERVER_PATH }}"

          sudo docker compose up \
            --detach \
            --force-recreate \
            --remove-orphans
          ENDSSH
